apiVersion: v1
kind: ConfigMap
metadata:
  name: stream-chat-config
  namespace: stream-chat
data:
  SPRING_PROFILES_ACTIVE: "prod"
  APP_CORS_ALLOWED_ORIGINS: "https://chat.example.com"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: stream-chat-secret
  namespace: stream-chat
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET_AT_LEAST_32_BYTES"
  SPRING_DATASOURCE_PASSWORD: "stream_chat_pass"
  SPRING_DATA_REDIS_PASSWORD: ""
