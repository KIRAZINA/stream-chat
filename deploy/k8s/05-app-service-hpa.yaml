apiVersion: v1
kind: Service
metadata:
  name: stream-chat-app
  namespace: stream-chat
spec:
  selector:
    app: stream-chat-app
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stream-chat-app-hpa
  namespace: stream-chat
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: stream-chat-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
