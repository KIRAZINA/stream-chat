apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-chat-app
  namespace: stream-chat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stream-chat-app
  template:
    metadata:
      labels:
        app: stream-chat-app
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: stream-chat-app
          image: stream-chat:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: stream-chat-config
            - secretRef:
                name: stream-chat-secret
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/stream_chat_db"
            - name: SPRING_DATASOURCE_USERNAME
              value: "stream_chat_user"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1536Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
