# Application
spring.application.name=stream-chat
server.port=8080

# JWT Configuration
jwt.secret=dev-secret-key-please-change-in-production-must-be-at-least-64-characters-long
jwt.expiration=86400000
jwt.access-token-ttl=PT15M
jwt.refresh-token-ttl=P30D

# Database (H2 for development)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (dev only — explicitly enabled in application-dev.properties)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Redis (disabled for development)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Logging
logging.level.root=INFO
logging.level.com.streamchat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# CORS (comma-separated). Use explicit origins in prod.
app.cors.allowed-origins=*

# Chat message retention policy (days)
app.chat.retention-days=90

# Audit log retention policy (days)
app.audit.retention-days=365

# AutoMod configuration
app.automod.caps-threshold=0.7
app.automod.spam-score-threshold=3
app.automod.trust-decay-rate=0.1
app.automod.shadow-ban-enabled=true

# Slow mode enforcement storage. Default profile has Redis excluded (see above),
# so slow mode must use the in-process Caffeine store or it silently never blocks.
# redis (single source of truth, atomic Lua GET+SET, fails open on Redis outage)
# is used by the docker/prod profiles where Redis is present.
chat.slowmode.storage=memory

# WebSocket (2.1 hardening) - all limits externalized
# Allowed browser origins for /ws-chat. Must be an explicit list, NEVER '*':
# fail-fast in WebSocketConfig. Keep in sync with app.cors.allowed-origins.
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000
# Max incoming STOMP frame size in bytes (e.g. 64 KiB)
app.websocket.incoming-message-size-limit=65536
# Max ms a send may block flushing to a slow session before it is closed
app.websocket.send-time-limit-ms=10000
# Max bytes buffered per session before it is closed (e.g. 512 KiB)
app.websocket.send-buffer-size-limit=524288
# Max ms for the client to send its first frame (guards idle opens)
app.websocket.time-to-first-message-ms=30000
# Broker heartbeat interval in ms (server<->client keep-alive + dead-session reaping)
app.websocket.heartbeat-interval-ms=10000
# Thread pool size for the heartbeat TaskScheduler
app.websocket.scheduler-pool-size=2

# Track A Item 1: local-first broadcast. When true, chat messages are delivered
# directly via the in-memory broker (no Redis round trip), valid because stream
# affinity guarantees the sender is on the owner instance. Default OFF: use the
# Redis fan-out path (chat:messages:*) so all instances broadcast.
chat.broadcast.local-first=false

# Actuator - expose all endpoints in dev
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
