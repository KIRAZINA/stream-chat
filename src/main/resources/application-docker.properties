# Database (Docker env vars injected by docker-compose)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.redis.host=redis
spring.redis.port=6379

# H2 Console is never exposed outside the dev profile
spring.h2.console.enabled=false

# JWT (Override with environment variable)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P30D}

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Slow mode: Redis is the single source of truth (atomic Lua GET+SET)
chat.slowmode.storage=redis
