# Database (H2 for development, PostgreSQL compatibility mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:chatdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA — Flyway owns the schema; Hibernate only validates entity mappings
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keep connection pool small to avoid exhausting Postgres max_connections in CI
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:2}

# Flyway migrations V1-V9 run before Hibernate validates the schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Disable Redis for dev profile (use in-memory instead)
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT (DEV-ONLY fallback; production and docker profiles must provide JWT_SECRET)
jwt.secret=${JWT_SECRET:dev-secret-key-please-change-in-production-must-be-at-least-64-characters-long}
jwt.expiration=86400000

# CORS (comma-separated; explicit local development origins)
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Slow mode dev escape hatch: in-process Caffeine storage (Redis disabled here)
chat.slowmode.storage=memory

