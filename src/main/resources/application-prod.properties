# Database (Use environment variables)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
jwt.refresh-token-ttl=${JWT_REFRESH_TOKEN_TTL:P30D}

# H2 Console is never exposed outside the dev profile
spring.h2.console.enabled=false

# Security
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# WebSocket (2.1): share the operator's CORS origins so HTTP and WS stay in
# sync; explicit non-wildcard fallback if the variable is unset (fail-fast on
# empty/'*' lives in WebSocketConfig).
app.websocket.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Chat message retention policy (days)
app.chat.retention-days=${CHAT_RETENTION_DAYS:90}

# Slow mode: Redis is the single source of truth (atomic Lua GET+SET)
chat.slowmode.storage=redis
